# Eclipse Mosquitto MQTT Broker Configuration
# ─────────────────────────────────────────────

# Allow anonymous connections (MVP - no auth needed for demo)
allow_anonymous true

# Default MQTT listener on port 1883
listener 1883

# Optional: WebSocket listener for browser-based MQTT clients
# listener 9001
# protocol websockets

# Logging
log_type error
log_type warning
log_type notice
log_type information

# Persistence (optional for MVP)
persistence true
persistence_location /mosquitto/data/
